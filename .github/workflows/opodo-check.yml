# Manually triggered check of the `opodo` source from a GitHub-hosted runner: does Opodo
# keep answering a plain headless browser over a run of searches? Placeholder routes
# (scripts/opodo_check.py); prints outcomes, row counts, cheapest fares and timings only.
name: Opodo check

on:
  workflow_dispatch:
    inputs:
      searches:
        description: Round-trip searches to run (one page load each)
        default: "20"
      pause:
        description: Seconds between searches
        default: "180"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies and a browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Search
        env:
          SEARCHES: ${{ inputs.searches }}
          PAUSE: ${{ inputs.pause }}
          PYTHONIOENCODING: utf-8
          PYTHONPATH: .
        run: python scripts/opodo_check.py "$SEARCHES" "$PAUSE"
